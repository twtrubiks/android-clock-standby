name: Release

# push v* tag（例如 v1.0.0）時發佈正式版：
#   1. 檢查 tag 和 app/build.gradle.kts 的 versionName 一致
#   2. 跑單元測試，用正式金鑰打包 release APK，確認簽章不是 debug 金鑰
#   3. 建立 GitHub Release，附上 clock-standby.apk 和 SHA-256，更新說明列出上一版之後的 commit
# 金鑰放在 GitHub Secrets（RELEASE_KEYSTORE_BASE64、RELEASE_KEYSTORE_PASSWORD），設定方式見 docs/release.md。
# 模擬器上的冒煙測試由 android-record.yml 負責，打 tag 前先確認那個 commit 在 main 的錄影通過。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # 更新說明要找上一個 v* tag
          fetch-depth: 0

      - name: Check version
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME 和 versionName（$version）不一致，先改 app/build.gradle.kts 再打 tag"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::缺少 secret RELEASE_KEYSTORE_BASE64，設定方式見 docs/release.md"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: clock-standby
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Verify signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          if grep -q 'CN=Android Debug' "$RUNNER_TEMP/certs.txt"; then
            echo "::error::APK 是用 debug 金鑰簽的，檢查 RELEASE_KEYSTORE_FILE 有沒有傳進 Gradle"
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p release
          # 檔名固定，README 用 releases/latest/download/clock-standby.apk 下載最新版
          cp app/build/outputs/apk/release/app-release.apk release/clock-standby.apk
          (cd release && sha256sum clock-standby.apk > clock-standby.apk.sha256)

          prev=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## 更新內容"
            echo
            git log --no-merges --format='- %s' "${prev:+$prev..}$GITHUB_REF_NAME"
            echo
            echo "## 安裝"
            echo
            echo "下載 \`clock-standby.apk\` 在手機上安裝（手機要允許「安裝未知應用程式」）。"
            echo "裝過 v1.0.0 之前、用 debug 金鑰簽的舊版時，要先移除一次；之後的版本都能直接覆蓋升級，設定會保留。"
            if [ -n "$prev" ]; then
              echo
              echo "完整差異：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}"
            fi
          } > release/notes.md

          gh release create "$GITHUB_REF_NAME" release/clock-standby.apk release/clock-standby.apk.sha256 \
            --verify-tag --latest --title "時鐘待機 $GITHUB_REF_NAME" --notes-file release/notes.md
